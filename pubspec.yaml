name: e_commerces
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  flutter_image_slideshow: ^0.1.6
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  get_storage: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
  assets:
    - assets/images/cover_slide/
    - assets/images/products_latest/
    - assets/images/products_popular/
    - assets/images/
    - assets/icons/
